services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - tutor-postgres-data:/var/lib/postgresql/data

volumes:
  tutor-postgres-data:
